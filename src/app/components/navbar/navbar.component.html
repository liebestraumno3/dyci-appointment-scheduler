<a class="skip-link" href="#main-content">Skip to main content</a>

<header class="navbar">
  <div class="navbar-inner">
    <div class="navbar-left">
      <a class="brand" routerLink="/" (click)="closeMobileMenu()">
        <svg
          class="brand-mark"
          width="18"
          height="18"
          viewBox="0 0 18 18"
          fill="none"
          aria-hidden="true"
        >
          <rect
            x="2"
            y="3.5"
            width="14"
            height="12.5"
            rx="2"
            stroke="currentColor"
            stroke-width="1.5"
          />
          <path d="M5.5 2V5M12.5 2V5M2 7.5H16" stroke="currentColor" stroke-width="1.5" />
          <path d="M6 11H9.5" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round" />
        </svg>
        <span class="brand-name">{{ brandName }}</span>
      </a>
      <span class="brand-divider" aria-hidden="true">/</span>
      <span class="brand-meta">{{ groupLabel }}</span>
    </div>

    <nav class="desktop-nav" aria-label="Primary navigation">
      @for (item of navItems; track item.route) {
        <a
          class="nav-link"
          [routerLink]="item.route"
          routerLinkActive="nav-link--active"
          [routerLinkActiveOptions]="{ exact: item.exact }"
        >
          {{ item.label }}
        </a>
      }
    </nav>

    <div class="navbar-right">
      <a class="btn btn-primary btn-sm desktop-cta" routerLink="/appointments/new">
        + New Appointment
      </a>

      <button
        type="button"
        class="btn btn-secondary btn-sm mobile-toggle"
        [attr.aria-expanded]="mobileMenuOpen()"
        aria-controls="mobile-nav"
        aria-label="Toggle navigation menu"
        (click)="toggleMobileMenu()"
      >
        @if (mobileMenuOpen()) {
          Close
        } @else {
          Menu
        }
      </button>
    </div>
  </div>

  @if (mobileMenuOpen()) {
    <nav id="mobile-nav" class="mobile-nav" aria-label="Mobile navigation">
      @for (item of navItems; track item.route) {
        <a
          class="mobile-nav-link"
          [routerLink]="item.route"
          routerLinkActive="mobile-nav-link--active"
          [routerLinkActiveOptions]="{ exact: item.exact }"
          (click)="closeMobileMenu()"
        >
          {{ item.label }}
        </a>
      }
      <a
        class="btn btn-primary mobile-nav-cta"
        routerLink="/appointments/new"
        (click)="closeMobileMenu()"
      >
        + New Appointment
      </a>
    </nav>
  }
</header>
